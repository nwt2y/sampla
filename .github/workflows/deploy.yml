name: Deploy to Elastic Beanstalk

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EB_APP: semple
  EB_ENV: Semple-env-10-27-9-41

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Build
        working-directory: sampla
        run: mvn -B clean package -DskipTests

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Elastic Beanstalk
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="elasticbeanstalk-${AWS_REGION}-${ACCOUNT_ID}"
          VERSION="${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          JAR=$(ls sampla/target/*.jar | grep -v original | head -n 1)

          aws s3 cp "$JAR" "s3://${BUCKET}/deploy/${VERSION}.jar"

          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APP" \
            --version-label "$VERSION" \
            --source-bundle S3Bucket="$BUCKET",S3Key="deploy/${VERSION}.jar"

          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENV" \
            --version-label "$VERSION"

          aws elasticbeanstalk wait environment-updated \
            --environment-names "$EB_ENV"
